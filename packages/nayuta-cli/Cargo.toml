[package]
name = "nayuta-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Create and manage reading-first Nayuta blogs"
repository = "https://github.com/yuanzui-cf/nayuta"

[[bin]]
name = "nayuta"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "string"] }
crossterm = "0.29"
directories = "6"
flate2 = "1"
fs2 = "0.4"
oxc_allocator = "0.110"
oxc_ast = { version = "0.110", features = ["serialize"] }
oxc_parser = "0.110"
oxc_span = "0.110"
ratatui = "0.30"
regress = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
unicode-width = "0.2"
walkdir = "2"
yaml-edit = "0.3"
yaml-rust2 = "0.11"

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "unwind"

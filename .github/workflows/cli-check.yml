name: CLI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run cli:version:check
      - run: bun run cli:wrapper:check && bun run cli:wrapper:test && bun run cli:wrapper:build
      - run: bun run format:check && bun run check && bun run test && bun run build
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/nayuta-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nayuta-cli
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: cargo test --locked create_has_one -- --nocapture
        env:
          NAYUTA_TEST_SITE_BUILD: '1'
